# Synthetic multi-ecosystem tool type configurations for data generation.
# Each tool type defines description, sample count, scenarios, and seed examples.

tool_types:
  npm_install:
    description: "npm install / yarn add / pnpm install package manager output including dependency conflicts, vulnerability reports, deprecated package warnings, and resolution errors"
    samples: 200
    scenarios:
      - "Clean install with many transitive dependencies and deprecation warnings"
      - "Dependency version conflict between direct and peer dependencies"
      - "Install failing due to incompatible Node.js engine version"
      - "Audit report showing critical vulnerabilities in nested dependencies"
      - "Lockfile conflict after merging branches with different dependency trees"
    seed_examples:
      - task: "Fix the authentication middleware dependency issue after upgrading to Express 5"
        tool_output: |
          npm install
          npm WARN deprecated inflight@1.0.6: This module is not supported, and leaks memory.
          npm WARN deprecated @humanwhocodes/config-array@0.11.14: Use @eslint/config-array instead
          npm WARN deprecated rimraf@3.0.2: Rimraf versions prior to v4 are no longer supported
          npm ERR! code ERESOLVE
          npm ERR! ERESOLVE unable to resolve dependency tree
          npm ERR!
          npm ERR! While resolving: auth-service@2.1.0
          npm ERR! Found: express@5.0.0
          npm ERR! node_modules/express
          npm ERR!   express@"^5.0.0" from the root project
          npm ERR!
          npm ERR! Could not resolve dependency:
          npm ERR! peer express@"^4.17.0" from passport@0.6.0
          npm ERR! node_modules/passport
          npm ERR!   passport@"^0.6.0" from the root project
          npm ERR!
          npm ERR! Fix the upstream dependency conflict, or retry
          npm ERR! this command with --force or --legacy-peer-deps
        relevant_lines:
          - "npm ERR! ERESOLVE unable to resolve dependency tree"
          - "npm ERR! peer express@\"^4.17.0\" from passport@0.6.0"
          - "npm ERR! Fix the upstream dependency conflict, or retry"
      - task: "Investigate why the CI pipeline reports high severity vulnerabilities"
        tool_output: |
          npm install
          added 1247 packages, and audited 1248 packages in 32s

          87 packages are looking for funding
            run `npm fund` for details

          6 vulnerabilities (1 low, 2 moderate, 2 high, 1 critical)

          ┌───────────────┬──────────────────────────────────────────────────────────┐
          │ Critical       │ Prototype Pollution in lodash.merge                    │
          ├───────────────┼──────────────────────────────────────────────────────────┤
          │ Package        │ lodash.merge                                           │
          │ Dependency of  │ react-scripts                                          │
          │ Path           │ react-scripts > webpack > lodash.merge                 │
          │ More info      │ https://github.com/advisories/GHSA-p6mc-m468-83gw     │
          └───────────────┴──────────────────────────────────────────────────────────┘

          To address all issues (including breaking changes), run:
            npm audit fix --force
        relevant_lines:
          - "6 vulnerabilities (1 low, 2 moderate, 2 high, 1 critical)"
          - "│ Critical       │ Prototype Pollution in lodash.merge                    │"
          - "│ Path           │ react-scripts > webpack > lodash.merge                 │"
      - task: "Set up the project on a new machine after cloning the monorepo"
        tool_output: |
          npm install
          npm WARN deprecated querystring@0.2.0: The querystring API is considered Legacy.
          npm WARN deprecated svgo@1.3.2: This SVGO version is no longer supported. Upgrade to v2.x.x.
          npm ERR! code EBADENGINE
          npm ERR! engine Unsupported engine
          npm ERR! engine Not compatible with your version of node/npm
          npm ERR! notsup Required: {"node":">=18.0.0"}
          npm ERR! notsup Actual:  {"node":"v16.20.2","npm":"8.19.4"}
          npm ERR!
          npm ERR! A complete log of this run can be found in:
          npm ERR!   /home/user/.npm/_logs/2024-03-15T10_22_33_891Z-debug-0.log
        relevant_lines:
          - "npm ERR! engine Unsupported engine"
          - "npm ERR! notsup Required: {\"node\":\">=18.0.0\"}"
          - "npm ERR! notsup Actual:  {\"node\":\"v16.20.2\",\"npm\":\"8.19.4\"}"

