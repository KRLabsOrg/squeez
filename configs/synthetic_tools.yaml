      - "Production build with chunk size warnings and tree-shaking issues"
      - "Build failing due to TypeScript strict mode violations"
      - "Vite build with CSS module resolution errors"
      - "Next.js build with static generation failures on dynamic routes"
      - "Webpack build with circular dependency warnings and memory issues"
    seed_examples:
      - task: "Fix the production build that started failing after adding the dashboard component"
        tool_output: |
          > next build

